# AndroidX is required by every dependency in app/build.gradle.kts. Without
# this, :app:checkDebugAarMetadata fails and prints the entire dependency graph,
# which buries the one-line cause.
android.useAndroidX=true

# Non-transitive R classes: each module gets only its own resources. Smaller
# R classes and faster builds, and the default from AGP 8 onward anyway.
android.nonTransitiveRClass=true

# The Kotlin daemon inherits this. 2 GB is enough for Compose compilation and
# leaves room on a laptop that is also running Mongo, the backend and Next.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
